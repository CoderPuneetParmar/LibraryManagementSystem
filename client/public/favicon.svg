<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Navy Blue Container with Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="#1e3a5f"/>
  
  <!-- Subtle Amber Accent Border -->
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#d4a017" stroke-width="2.5"/>
  
  <!-- Open Book Icon (Lucide BookOpen Style) -->
  <g transform="translate(12, 12)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Page (Warm Amber Gold) -->
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" fill="#d4a017" stroke="#d4a017" stroke-width="2.5"/>
    
    <!-- Right Page (Clean White) -->
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" fill="#ffffff" stroke="#ffffff" stroke-width="2.5"/>
    
    <!-- Left Page Text Lines (Navy Blue) -->
    <line x1="5" y1="8" x2="9" y2="8" stroke="#1e3a5f" stroke-width="2"/>
    <line x1="5" y1="12" x2="9" y2="12" stroke="#1e3a5f" stroke-width="2"/>

    <!-- Right Page Text Lines (Navy Blue) -->
    <line x1="15" y1="8" x2="19" y2="8" stroke="#1e3a5f" stroke-width="2"/>
    <line x1="15" y1="12" x2="19" y2="12" stroke="#1e3a5f" stroke-width="2"/>
  </g>
</svg>